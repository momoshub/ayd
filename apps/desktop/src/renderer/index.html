<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>ayd — demo runner</title>
    <style>
      :root {
        --bg: #0d0f14;
        --surface: #151821;
        --surface-2: #1c202b;
        --surface-3: #232836;
        --border: #2a2f3c;
        --border-soft: #21252f;
        --text: #e8eaf0;
        --muted: #98a1b3;
        --faint: #6b7385;
        --accent: #6d6cf5;
        --accent-2: #8b7cf6;
        --accent-ink: #ffffff;
        --admin: #ef4444;
        --user: #22c55e;
        --danger: #f26363;
        --ok: #34d399;
        --radius: 14px;
        --radius-sm: 9px;
        color-scheme: dark light;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef0f4;
          --surface: #ffffff;
          --surface-2: #f3f5f8;
          --surface-3: #e9edf3;
          --border: #dde1e8;
          --border-soft: #e8ebf0;
          --text: #171a21;
          --muted: #58616f;
          --faint: #8a92a1;
          --accent: #5b5bd6;
          --accent-2: #7c6cf0;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- header ---- */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .mark {
        font-weight: 700;
        letter-spacing: 0.01em;
        font-size: 16px;
      }
      .mark .dot {
        color: var(--accent);
      }
      .tagline {
        color: var(--faint);
        font-size: 12px;
      }
      .legend {
        display: inline-flex;
        gap: 12px;
        margin-left: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend .swatch {
        width: 9px;
        height: 9px;
        border-radius: 3px;
      }
      .legend .admin {
        background: var(--admin);
      }
      .legend .user {
        background: var(--user);
      }
      #profile {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-2);
        max-width: 42%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #profile::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        flex: none;
        transition: background 0.2s ease;
      }
      #profile.live::before {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent);
      }

      /* ---- layout ---- */
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr);
        gap: 16px;
        padding: 16px 20px 20px;
        min-height: 0;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-soft);
      }
      .card-head h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
      }
      .card-head .hint {
        margin-left: auto;
        font-size: 11px;
        color: var(--faint);
      }
      .card-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }

      /* ---- chat (the star) ---- */
      .chat {
        flex: 1;
      }
      #transcript {
        flex: 1;
        overflow: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      #transcript:empty::before {
        content: 'Say what you want demoed. The agent drives the open browser live — interrupt or steer it any time.';
        color: var(--faint);
        font-size: 13px;
        max-width: 44ch;
      }
      .msg {
        max-width: 82%;
        padding: 9px 12px;
        border-radius: 13px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        animation: pop 0.14s ease;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }
      .msg.you {
        align-self: flex-end;
        background: var(--accent);
        color: var(--accent-ink);
        border-bottom-right-radius: 4px;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--surface-3);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .msg.err {
        align-self: flex-start;
        background: color-mix(in srgb, var(--danger) 16%, var(--surface));
        color: var(--danger);
        border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .action {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 82%;
        padding: 5px 10px;
        border-radius: 8px;
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        color: var(--muted);
        font:
          11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .action .tool {
        color: var(--accent-2);
        font-weight: 600;
      }
      .status {
        align-self: center;
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.02em;
      }
      .status.divider {
        width: 100%;
        text-align: center;
        border-top: 1px dashed var(--border);
        padding-top: 8px;
      }

      /* ---- composer ---- */
      .composer {
        border-top: 1px solid var(--border-soft);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .composer textarea {
        width: 100%;
        resize: none;
        min-height: 52px;
        max-height: 140px;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font: inherit;
        font-size: 13px;
      }
      .composer textarea::placeholder {
        color: var(--faint);
      }
      .composer textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .composer-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .composer-actions .grow {
        flex: 1;
      }
      .composer-actions .keyhint {
        font-size: 11px;
        color: var(--faint);
      }

      /* ---- scripted tools ---- */
      textarea.field {
        width: 100%;
        resize: none;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      textarea.field::placeholder {
        color: var(--faint);
      }
      textarea.field:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      #description {
        min-height: 58px;
      }
      #script {
        min-height: 96px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* ---- buttons ---- */
      button {
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        padding: 8px 15px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          filter 0.12s ease,
          background 0.12s ease,
          color 0.12s ease,
          border-color 0.12s ease,
          opacity 0.12s ease;
      }
      button:active {
        transform: translateY(0.5px);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn-primary:hover:not(:disabled) {
        filter: brightness(1.09);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
      }
      .btn-ghost:hover:not(:disabled) {
        color: var(--text);
        border-color: var(--faint);
      }
      .btn-danger {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
      }
      .btn-danger:hover:not(:disabled) {
        color: var(--danger);
        border-color: var(--danger);
      }

      /* ---- run log ---- */
      .log-card {
        flex: 1;
        min-height: 140px;
      }
      #log {
        margin: 0;
        flex: 1;
        overflow: auto;
        padding: 12px 14px;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      #log .line {
        white-space: pre-wrap;
      }
      #log .ok {
        color: var(--ok);
      }
      #log .err {
        color: var(--danger);
      }
      #log .hdr {
        color: var(--text);
        font-weight: 600;
      }
      #log:empty::before {
        content: 'Scripted-run events stream here.';
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">ayd<span class="dot">.</span></span>
      <span class="tagline">automate y_our demo(n)s</span>
      <span class="legend">
        <span><span class="swatch admin"></span>admin</span>
        <span><span class="swatch user"></span>user</span>
      </span>
      <span id="profile">loading profile…</span>
    </header>

    <main>
      <!-- LEFT: the live agent -->
      <div class="col">
        <section class="card chat">
          <div class="card-head">
            <h2>Live agent</h2>
            <span class="hint" id="chat-hint">idle — send a message to open the browser</span>
          </div>
          <div id="transcript"></div>
          <div class="composer">
            <textarea
              id="chat-input"
              placeholder="Tell the agent what to demo, e.g. “log in as admin and open the cases inbox”. Enter to send, Shift+Enter for a newline."
              autofocus
            ></textarea>
            <div class="composer-actions">
              <button id="send" class="btn-primary">Send</button>
              <button id="continue" class="btn-ghost" disabled>Continue</button>
              <button id="interrupt" class="btn-ghost" disabled>Interrupt</button>
              <span class="grow"></span>
              <span class="keyhint">⏎ send · ⇧⏎ newline</span>
              <button id="end" class="btn-danger" disabled>End</button>
            </div>
          </div>
        </section>
      </div>

      <!-- RIGHT: scripted tools + run log -->
      <div class="col">
        <section class="card">
          <div class="card-head"><h2>Plan from a description</h2></div>
          <div class="card-body">
            <textarea
              id="description"
              class="field"
              placeholder="e.g. admin grants a template, the scoped user refreshes and sees it appear"
            ></textarea>
            <div class="actions">
              <button id="plan" class="btn-primary">Plan &amp; Run</button>
              <button id="stop" class="btn-danger">Stop</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Run a saved script</h2></div>
          <div class="card-body">
            <textarea
              id="script"
              class="field"
              placeholder='{ "id": "…", "title": "…", "personas": [ … ], "steps": [ … ] }'
            ></textarea>
            <div class="actions">
              <button id="run" class="btn-primary">Run Script</button>
            </div>
          </div>
        </section>

        <section class="card log-card">
          <div class="card-head">
            <h2>Run log</h2>
            <span class="hint"
              ><span style="color: var(--ok)">✓ ok</span> ·
              <span style="color: var(--danger)">✗ failed</span></span
            >
          </div>
          <div id="log"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
